services:
  local-embed:
    build:
      context: ./local_embedding
      dockerfile: Dockerfile
      args:
        MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8009:8009"
    environment:
      - MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    restart: unless-stopped
