<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    SmartNote app icon — black tile + white "SN" wordmark, mirroring
    the left-rail monogram. Follows Apple Big Sur+ icon conventions:

      • 1024 canvas with ~100px transparent margin (Apple's icon grid
        keeps the visible shape inside an 824 box so the dock's
        size-equalizer treats it the same as system apps).
      • Rounded square with rx = 185 (~22.4% of 824 — the canonical
        macOS squircle radius. iOS-style 25% looked oversized next
        to system icons in the dock).
      • Content inset 100px on every side.
  -->
  <defs>
    <linearGradient id="topGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="6%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
  </defs>

  <!-- Outer ring (separation against dark dock backgrounds) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ring)"/>
  <!-- Tile body -->
  <rect x="103" y="103" width="818" height="818" rx="183" fill="#0a0a0a"/>
  <!-- Top gloss -->
  <rect x="103" y="103" width="818" height="818" rx="183" fill="url(#topGloss)"/>

  <!-- SN wordmark, baseline-aligned, S dominant + N lighter.
       Numbers picked so the glyphs look optically centered inside
       the 824x824 visible square. -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif"
     fill="#ffffff">
    <text
      x="392" y="640"
      text-anchor="middle"
      font-size="520"
      font-weight="700"
      letter-spacing="-22"
    >S</text>
    <text
      x="688" y="640"
      text-anchor="middle"
      font-size="430"
      font-weight="500"
      letter-spacing="-10"
      opacity="0.62"
    >N</text>
  </g>
</svg>
