[project]
name = "smartnote-cloud-mcp"
version = "0.1.0"
description = "MCP bridge to the SmartNote Cloud agent-memory API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2",
    "httpx>=0.27",
    "smartnote-cloud>=0.1.0",
]

[project.scripts]
smartnote-cloud-mcp = "server:mcp.run"
