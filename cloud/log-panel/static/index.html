<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmartNote · Log Panel</title>
<link rel="stylesheet" href="/static/panel.css" />
</head>
<body>
<div class="shell">

  <header class="topbar">
    <span class="brand"><b>SmartNote</b> · Log Panel <span class="dev-tag">internal</span></span>
    <span class="crumbs" id="cloud-info">connecting…</span>
    <span class="spacer"></span>
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button data-theme-set="light" aria-pressed="true">Light</button>
      <button data-theme-set="dark"  aria-pressed="false">Dark</button>
    </div>
  </header>

  <div class="stats-strip" id="stats-strip">
    <div class="stat"><span class="lbl">Runs · 24h</span><span class="num" id="s-runs-24">—</span></div>
    <div class="stat"><span class="lbl">Events · 24h</span><span class="num" id="s-events-24">—</span></div>
    <div class="stat"><span class="lbl">Errors · 24h</span><span class="num" id="s-errors-24">—</span></div>
    <div class="stat"><span class="lbl">Workspaces · 24h</span><span class="num" id="s-ws-24">—</span></div>
    <div class="stat"><span class="lbl">LLM cost · 24h</span><span class="num" id="s-cost-24">—</span></div>
    <span class="spacer"></span>
    <button id="btn-refresh" class="btn btn-ghost btn-sm" title="Reload">↻</button>
  </div>

  <div class="body">

    <aside class="side">
      <div class="search-row">
        <input id="q" placeholder="event / message / error contains…" autocomplete="off" />
      </div>
      <div class="filter-row">
        <select id="f-workspace">
          <option value="">all workspaces</option>
        </select>
        <select id="f-stage">
          <option value="">all stages</option>
          <option value="chunk_embed">chunk_embed</option>
          <option value="ai_enrich">ai_enrich</option>
          <option value="wiki_abstract">wiki_abstract</option>
          <option value="note_classify">note_classify</option>
          <option value="graph">graph</option>
        </select>
        <select id="f-status">
          <option value="">all statuses</option>
          <option value="queued">queued</option>
          <option value="running">running</option>
          <option value="done">done</option>
          <option value="failed">failed</option>
          <option value="partial">partial</option>
          <option value="skipped">skipped</option>
        </select>
      </div>
      <div class="actions-row">
        <button id="btn-search" class="btn btn-primary btn-sm">Search</button>
        <button id="btn-recent" class="btn btn-ghost btn-sm">Recent</button>
      </div>

      <div class="list-head">
        <span id="list-title">Recent runs</span>
        <span id="list-meta" class="meta"></span>
      </div>
      <div class="list" id="list">
        <div class="empty">Loading…</div>
      </div>
    </aside>

    <main class="detail" id="detail">
      <div class="empty-state">
        <h2>Pick a run</h2>
        <p>Click a run on the left, or paste a <code>run_id</code> in the URL: <code>?run=...</code></p>
      </div>
    </main>

  </div>
</div>

<script src="/static/panel.js"></script>
</body>
</html>
